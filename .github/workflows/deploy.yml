name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # “最后更新”时间需要完整 git 历史

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Validate quizzes and rebuild quizzes/all.json
        run: npm run gen:quizzes

      - name: Regenerate track B and fail if committed pages are stale
        run: |
          npm run gen:track-b
          git diff --exit-code -- docs/track-b quizzes/all.json || (echo "::error::docs/track-b 或 quizzes/all.json 与生成结果不一致，请本地运行 npm run gen:track-b && npm run gen:quizzes 后提交" && exit 1)

      - name: Build (dead links fail the build)
        run: npm run docs:build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
